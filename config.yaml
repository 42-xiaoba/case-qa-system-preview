# ============================================================
# 智能案例问答系统 - 配置文件
# 提示词分为三层，修改此文件无需改动代码
# ============================================================

prompt:
  # ========== 第一层：系统人设与角色 ==========
  system_role: |
    你是一个专业的案例分析与问答助手，专注于帮助用户理解和分析案例内容。
    你的名字叫"智渡小武侯"，由清华大学公共管理学院智能社会治理实验团队提供技术支持。
    当用户询问你的名字、身份或让你自我介绍时，始终以"智渡小武侯"自称。
    你的回答必须严格基于系统提供的资料（常备知识卡与检索到的参考资料），做到准确、专业、有深度。
    请以严谨、客观、富有洞察力的态度与用户交流。

  # ========== 第二层：核心业务规则 ==========
  core_rules: |
    【资料来源与优先级铁律】
    你拥有的资料按可信度分为三级，回答时必须遵循：
    1. 第一优先级：《清华案例分析报告一稿》与《选题报告》——这是本团队的研究成果。
       任何涉及分析框架、观点、结论、研究方法的问题，必须首先以一稿内容为准作答。
    2. 第二优先级：案例原文——用于补充案例事实细节、时间线、数据出处。
    3. 第三优先级：文献汇编（外部学术文献）——仅在以下情况引用：
       (a) 用户明确询问某个理论或文献的出处、内容；
       (b) 需要用学术理论佐证一稿观点时，作为补充论据。
       严禁用文献观点覆盖或替代一稿的核心结论。
    4. 若不同资料表述冲突，以一稿为准，可补充说明"不同资料表述略有差异"。

    【引用规范】
    1. 引用一稿/选题报告时标注：（一稿·章节名）或（选题报告·章节名）。
    2. 引用文献时标注：（作者，年份，《文献名》），以参考资料中标注的作者与年份为准。
    3. 引用案例事实时标注：（案例文本·部分名）。

    【反幻觉铁律】
    1. 回答只能基于"常备知识卡"和"检索到的参考资料"中确实存在的内容。
    2. 若参考资料中没有依据，明确回答"现有资料未涉及这一问题"，并简述最接近的相关内容。
    3. 严禁编造数据、文献、作者、年份、章节名；严禁把文献观点说成一稿观点（或相反）。

    【关键数据零篡改】
    以下核心数据必须原样引用，不得改动或混淆：
    - 报表压减50%；填报数据项压减61%；基层填表工作量减少90%
    - 社区数仓覆盖武侯区11个街道72个社区
    - 数据归集后报表制作时间从数周缩短至半天
    - 浆洗街街道就业帮扶链：2476条数据→230条有效线索→31家企业→15人实现就业

    【通用规则】
    1. 问题超出资料范围时，礼貌说明并引导回案例相关话题。
    2. 专业术语（交易成本理论、任务-技术匹配模型、技术执行框架等）需结合案例清晰解释。
    3. 回答应结合具体政策文件、数据指标、人物观点、时间节点，避免空洞的泛泛而谈。

  # ========== 第三层：输出格式要求 ==========
  output_format: |
    请按照以下格式要求组织回答：
    1. 回答应结构清晰，使用分点或分段方式组织内容，便于阅读。
    2. 引用资料时按【引用规范】标注来源，如（一稿·案例摘要）、（范炜烽，2019，《文献名》）。
    3. 语言风格应专业但不晦涩，适合大学生理解，适当使用比喻帮助理解复杂概念。
    4. 如果涉及多个层面的分析，建议使用小标题（如"一、""二、""三、"）组织内容。
    5. 回答长度适中，根据问题复杂度控制在300-800字之间。

# ========== 模型配置 ==========
model:
  name: "glm-4.7-flash"  # 模型名称（智谱免费模型，API 调用名称为 glm-4.7-flash）
  base_url: "https://open.bigmodel.cn/api/paas/v4/"
  temperature: 0.7
  max_tokens: 2048
  top_p: 0.9
  thinking: false  # 关闭深度思考：混合推理模型的思考token会挤占max_tokens导致非流式回答为空
  # 全局并发闸门上限：设为 2 允许"回答流式输出"与"延伸问题预生成"并行请求，
  # 延伸问题卡片可与回答同时就绪；主用 SenseNova 额度充足、无按并发数限流困扰。
  # 若切回按并发数限流的免费档（如智谱 GLM）出现自致 429 时，可调回 1 让超额请求排队。
  concurrency: 2
  # 多 Key 轮换（可选）：在 .env 中追加 GLM_API_KEY_2 / GLM_API_KEY_3 等，
  # 每把 Key 拥有独立的限流配额，系统会自动将其纳入请求序列轮流使用

# ========== 视觉模型配置 ==========
vision_model:
  name: "glm-4.6v-flash"  # 智谱免费视觉模型
  base_url: "https://open.bigmodel.cn/api/paas/v4/"
  temperature: 0.7
  max_tokens: 2048
  top_p: 0.9

# ========== 模型降级链配置 ==========
# 主模型出现限流(429)/超时等异常无法正常工作时，按顺序降级到备用模型：
# 文本链：sensenova-6.8-flash-lite(主用，额度充足) → glm-4.7-flash(GLM_API_KEY/_2 轮换)
#         → glm-4.6v-flash(GLM_V_API_KEY/_2 轮换)
#         → OpenRouter nemotron → glm-4.6v（末位兜底）
# 视觉链：glm-4.6v-flash(GLM_V_API_KEY/_2 轮换) → sensenova-6.8-flash-lite → glm-4.6v
fallback:
  enabled: true
  sensenova:
    name: "sensenova-6.8-flash-lite"  # 以商汤控制台显示的模型 ID 为准，不符时只改这里
    base_url: "https://token.sensenova.cn/v1"
    api_key_env: "SENSENOVA_API_KEY"
  openrouter:
    name: "nvidia/nemotron-3-ultra-550b-a55b:free"
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OEPNROUTER_API_KEY"  # .env 中的变量名（历史拼写），代码同时兼容 OPENROUTER_API_KEY
  ultimate:
    name: "glm-4.6v"  # 末位兜底模型：前序全部失效才调用
    base_url: "https://open.bigmodel.cn/api/paas/v4/"
    api_key_env: "GLM_V_API_KEY_3"

# ========== 服务配置 ==========
server:
  fastapi_host: "0.0.0.0"
  fastapi_port: 8000
  streamlit_port: 8501

# ========== RAG 检索增强配置 ==========
rag:
  enabled: true
  chunks_path: "kb/chunks.json"        # Step 0 产出的知识块
  tier0_card_path: "kb/tier0_card.md"  # 常备知识卡（每次注入）
  bm25_top_k: 20          # BM25 初筛数量
  final_top_k: 6          # 重排后注入的块数
  min_score: 0.8          # 加权分数低于该值的块不注入（结果为空时兜底前2条）
  section_match_bonus: 0.35  # 章节标题命中查询词时的加分系数
  tier_weights:           # 来源可信度权重：自有文档 > 文献汇编
    "1": 1.35
    "2": 1.0
  budget:                 # 字符预算（防上下文溢出；预算越大 TTFT 越长，
                          # 已按"首字<10s"目标收紧：prefill 时间随输入长度近线性增长）
    tier0_chars: 1000     # 常备知识卡上限
    context_chars: 2400   # 检索块总上限（超限丢弃相关性最低的块）
    history_chars: 1200   # 历史对话上限（超限丢弃最早对话）
    summary_chars: 400    # 历史摘要上限
    total_chars: 7000     # 整个输入的兜底上限

# ========== 对话记忆配置 ==========
memory:
  recent_turns: 6         # 原样保留的最近对话轮数（1轮=1条user+1条assistant）
  compress_threshold: 14  # 历史消息数超过该值时触发滚动摘要压缩

# 主题美化配置（预留）
